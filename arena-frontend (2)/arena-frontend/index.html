<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar — Arena+</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/login.css">
</head>
<body>
  <main class="login">

    <section class="login__marca" aria-label="Arena+">
      <img src="assets/marca-arena.svg" alt="">
      <p class="wordmark wordmark--grande">Arena<span>+</span></p>
      <p class="login__lema">Campeonatos amadores com a tabela sempre em dia.</p>
    </section>

    <section class="login__painel">
      <form class="login__form" id="form-login" novalidate>

        <p class="alerta alerta--erro" id="login-erro" role="alert" hidden>Usuário ou senha inválidos.</p>

        <div class="campo">
          <label for="usuario">Usuário</label>
          <input id="usuario" name="usuario" type="text" autocomplete="username">
          <p class="campo__erro" role="alert"></p>
        </div>

        <div class="campo">
          <label for="senha">Senha</label>
          <input id="senha" name="senha" type="password" autocomplete="current-password">
          <p class="campo__erro" role="alert"></p>
        </div>

        <button class="btn btn--primario" type="submit">Entrar</button>

        <div class="login__acoes-secundarias">
          <button class="btn btn--primario" type="button">Esqueceu a senha?</button>
          <button class="btn btn--contorno" type="button">Criar conta</button>
        </div>
      </form>
    </section>

  </main>
    <script type="module" src="js/login.js"></script>
</body>
</html>
