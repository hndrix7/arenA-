<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Escolha o Tipo de Conta - Arena+</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Archivo:wght@100..900&display=swap">

    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/tipo-conta.css">
</head>

<body>

    <main class="tipo-conta">

        <section class="login__marca">

            <img src="assets/marca-arena.svg" alt="Logo Arena+">

            <p class="wordmark wordmark--grande">
                Arena<span>+</span>
            </p>

            <h1 class="login__lema">
                Escolha o Tipo de Conta
            </h1>

        </section>

        <section class="escolha">

            <h2>Como você deseja utilizar o Arena+?</h2>

            <div class="cards">

                <a href="criar-organizador.html" class="card">

                    <h3>Organizador</h3>

                    <p>
                        Crie campeonatos, gerencie inscrições,
                        partidas e resultados.
                    </p>

                </a>

                <a href="criar-diretor.html" class="card">

                    <h3>Diretor de Equipe</h3>

                    <p>
                        Cadastre equipes, jogadores,
                        escudos e participe dos campeonatos.
                    </p>

                </a>

            </div>

        </section>

    </main>

</body>
</html>
